# Alembic Configuration
# Database migration configuration for Consilience

[alembic]
# Path to migration scripts
script_location = migrations

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Version path separator
version_path_separator = os

# Timezone for migration file naming
# timezone =

# Set to 'true' to run environment during revision command
# as_is_base = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Database connection string (read from environment in env.py)
sqlalchemy.url = 

# Post-write hooks for code formatting
[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME
